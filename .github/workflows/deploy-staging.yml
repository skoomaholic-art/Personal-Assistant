name: Deploy existing Cloudflare staging
on:
  push:
    branches: [cloudflare-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-assistant-cloudflare-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require authorized Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. No deployment was attempted."
            exit 1
          fi
      - name: Ensure idempotent Telegram inbox schema exists on existing D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 execute rahal-mamut-staging --remote --file=migrations/0006_telegram_mentions.sql --config=wrangler.jsonc
      - name: Publish existing staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config=wrangler.jsonc
