name: Deploy existing Cloudflare staging
on:
  push:
    branches: [cloudflare-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-assistant-cloudflare-staging
  cancel-in-progress: false
jobs:
  # The Worker is published only after the syntax check and the full test suite pass.
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize Cloudflare API token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let token = (process.env.RAW_CLOUDFLARE_API_TOKEN || '').trim();
          if (token.startsWith('{')) {
            let parsed;
            try { parsed = JSON.parse(token); }
            catch {
              console.error('::error::Cloudflare secret contains invalid JSON. Copy just the API token value.');
              process.exit(1);
            }
            const candidates = [
              parsed.CLOUDFLARE_API_TOKEN, parsed.api_token, parsed.API_TOKEN,
              parsed.token, parsed.value,
              parsed.result?.CLOUDFLARE_API_TOKEN, parsed.result?.api_token,
              parsed.result?.token, parsed.result?.value,
              parsed.data?.token, parsed.data?.value
            ];
            token = candidates.find(value => typeof value === 'string' && value.trim()) || '';
          }
          token = token.replace(/^CLOUDFLARE_API_TOKEN\s*=\s*/i, '')
            .replace(/^Bearer\s+/i, '').replace(/^["']|["']$/g, '').trim();
          if (!/^[a-zA-Z0-9._~-]{20,}$/.test(token)) {
            console.error('::error::Cloudflare API token value is missing or invalid. The JSON must include a token or value field.');
            process.exit(1);
          }
          process.stdout.write('::add-mask::' + token + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_API_TOKEN=' + token + '\n');
          NODE
      - name: Inspect D1 schema before optional migration
        id: mentions_schema
        run: |
          npx --yes wrangler@4 d1 execute rahal-mamut-staging --remote --command "SELECT COUNT(*) AS present FROM sqlite_master WHERE type = 'table' AND name = 'telegram_mentions'" --json --config=wrangler.jsonc > "$RUNNER_TEMP/mentions-schema.json"
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/mentions-schema.json', 'utf8'));
          const blocks = Array.isArray(data) ? data : [data];
          const row = blocks.flatMap(item => item.results || item.result || []).find(item => Object.hasOwn(item, 'present'));
          const present = Number(row?.present);
          if (![0, 1].includes(present)) throw Error('Cannot determine existing D1 schema safely');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'present=' + (present ? 'true' : 'false') + '\n');
          console.log('Telegram inbox schema: ' + (present ? 'already exists, skipping migration' : 'missing, will create'));
          NODE
      - name: Create Telegram inbox schema only when absent
        if: steps.mentions_schema.outputs.present == 'false'
        run: npx --yes wrangler@4 d1 execute rahal-mamut-staging --remote --file=migrations/0006_telegram_mentions.sql --config=wrangler.jsonc
      - name: Inspect unified task schema before migration
        id: unified_schema
        run: |
          npx --yes wrangler@4 d1 execute rahal-mamut-staging --remote --command "SELECT COUNT(*) AS present FROM sqlite_master WHERE type = 'table' AND name = 'task_metadata'" --json --config=wrangler.jsonc > "$RUNNER_TEMP/unified-schema.json"
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/unified-schema.json', 'utf8'));
          const blocks = Array.isArray(data) ? data : [data];
          const row = blocks.flatMap(item => item.results || item.result || []).find(item => Object.hasOwn(item, 'present'));
          const present = Number(row?.present);
          if (![0, 1].includes(present)) throw Error('Cannot determine unified task schema safely');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'present=' + (present ? 'true' : 'false') + '\n');
          NODE
      - name: Create unified task schema only when absent
        if: steps.unified_schema.outputs.present == 'false'
        run: npx --yes wrangler@4 d1 execute rahal-mamut-staging --remote --file=migrations/0007_unified_task_system.sql --config=wrangler.jsonc
      - name: Create segment table (idempotent)
        run: npx --yes wrangler@4 d1 execute rahal-mamut-staging --remote --file=migrations/0008_item_segments.sql --config=wrangler.jsonc
      - name: Publish existing staging Worker
        run: npx --yes wrangler@4 deploy --config=wrangler.jsonc
      - name: Report readiness without disclosing Cloudflare secrets
        run: |
          if npx --yes wrangler@4 secret list --name rahal-mamut-staging --format json --config=wrangler.jsonc > "$RUNNER_TEMP/secret-names.json"; then
            node <<'NODE'
          const fs = require('node:fs');
          const entries = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/secret-names.json', 'utf8'));
          if (!Array.isArray(entries)) throw Error('Unknown Cloudflare secret-list format');
          const names = new Set(entries.map(item => item.name));
          const checks = ['TELEGRAM_BOT_TOKEN', 'TELEGRAM_WEBHOOK_SECRET', 'TELEGRAM_CHAT_ID', 'TELEGRAM_MENTION_INGEST_SECRET', 'SETUP_PASSWORD', 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GROQ_API_KEY'];
          for (const key of checks) console.log(key + ': ' + (names.has(key) ? 'configured' : 'MISSING'));
          NODE
          else
            echo '::warning::Could not inspect Cloudflare secret names; worker was already deployed.'
          fi
      - name: Create missing Telegram webhook secret without exposing it
        run: |
          npx --yes wrangler@4 secret list --name rahal-mamut-staging --format json --config=wrangler.jsonc > "$RUNNER_TEMP/bot-secrets.json"
          if node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/bot-secrets.json","utf8"));process.exit(v.some(x=>x.name==="TELEGRAM_WEBHOOK_SECRET")?0:1)'; then
            echo "Telegram webhook secret already exists, leaving it unchanged."
          else
            GENERATED_WEBHOOK_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
            echo "::add-mask::$GENERATED_WEBHOOK_SECRET"
            printf "%s" "$GENERATED_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put TELEGRAM_WEBHOOK_SECRET --name rahal-mamut-staging --config=wrangler.jsonc
            unset GENERATED_WEBHOOK_SECRET
            echo "Telegram webhook secret created. Existing Telegram webhook was NOT changed."
          fi
      - name: Inspect Worker bindings and retained task counts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + cfg.account_id + '/workers/scripts/' + cfg.name + '/settings',
                { headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN } });
              if (!response.ok) throw Error('HTTP ' + response.status);
              const data = await response.json();
              if (!data.success || !Array.isArray(data.result?.bindings)) throw Error('bindings unavailable');
              const names = new Set(data.result.bindings.map(item => item.name));
              for (const key of ['TELEGRAM_BOT_TOKEN', 'TELEGRAM_WEBHOOK_SECRET', 'TELEGRAM_CHAT_ID', 'TELEGRAM_MENTION_CHAT_IDS', 'TELEGRAM_MENTION_PRIVATE_CHAT_IDS']) {
                console.log('Worker binding ' + key + ': ' + (names.has(key) ? 'configured' : 'MISSING'));
              }
            } catch (error) { console.log('::warning::Worker binding inspection unavailable: ' + error.message); }
          })().catch(() => { process.exitCode = 1; });
          NODE
          npx --yes wrangler@4 d1 execute rahal-mamut-staging --remote --command "SELECT (SELECT COUNT(*) FROM tasks) AS existing_tasks, (SELECT COUNT(*) FROM emails) AS ingested_emails, (SELECT COUNT(*) FROM telegram_mentions) AS saved_mentions, (SELECT COUNT(*) FROM task_metadata) AS enriched_tasks" --json --config=wrangler.jsonc > "$RUNNER_TEMP/d1-counts.json"
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/d1-counts.json', 'utf8'));
          const blocks = Array.isArray(data) ? data : [data];
          const rows = blocks.flatMap(item => item.results || item.result || []);
          const result = rows.find(item => Object.hasOwn(item, 'existing_tasks'));
          if (!result) throw Error('D1 counts unavailable');
          console.log('D1 saved tasks: ' + result.existing_tasks);
          console.log('D1 saved email records: ' + result.ingested_emails);
          console.log('D1 saved Telegram mentions: ' + result.saved_mentions);
          console.log('D1 enriched tasks: ' + result.enriched_tasks);
          NODE
